# Serves the built SPA and proxies /api to the backend, so the browser sees a
# single origin (no CORS) — the same origin Cloudflare Tunnel points at.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache built assets aggressively (they are content-hashed by Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # LLM/Garmin calls can be slow
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
