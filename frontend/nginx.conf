# Serves the built SPA and proxies /api to the backend, so the browser sees a
# single origin (no CORS) — the same origin Cloudflare Tunnel points at.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache built assets aggressively (they are content-hashed by Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # Re-resolve the backend hostname at request time via Docker's embedded
        # DNS (127.0.0.11). Using a variable in proxy_pass forces runtime
        # resolution, so nginx recovers automatically if the backend container
        # restarts and gets a new IP (otherwise it caches the boot-time IP and
        # 502s forever). $upstream keeps the /api/ path prefix intact.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # LLM/Garmin calls can be slow
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
